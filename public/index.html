<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eatit - Svuota Frigo Intelligente</title>
    <style>
        :root {
            --bg-color: #050505;
            --text-color: #ffffff;
            --card-bg: rgba(20, 20, 20, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --muted-color: #888888;
            --glow-color: rgba(255, 255, 255, 0.03);
        }

        [data-theme="light"] {
            --bg-color: #f8f9fa;
            --text-color: #111111;
            --card-bg: rgba(255, 255, 255, 0.8);
            --border-color: rgba(0, 0, 0, 0.1);
            --muted-color: #666666;
            --glow-color: rgba(0, 0, 0, 0.02);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }

        .bg-diagonal-lines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: repeating-linear-gradient(
                45deg,
                var(--border-color),
                var(--border-color) 6px,
                transparent 6px,
                transparent 200px
            );
            opacity: 0.45;
            z-index: -2;
            pointer-events: none;
        }

        .bg-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, var(--glow-color) 0%, transparent 70%);
            z-index: -1;
            pointer-events: none;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            background-color: var(--bg-color);
            backdrop-filter: blur(10px);
            z-index: 1000;
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: -1px;
            text-transform: lowercase;
        }

        .nav-right {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .theme-toggle, .logout-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
        }

        .theme-toggle:hover, .logout-btn:hover {
            background-color: var(--text-color);
            color: var(--bg-color);
        }

        .container {
            flex: 1;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1;
        }

        /* Schermata Autenticazione */
        .auth-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            width: 100%;
            max-width: 400px;
            margin: auto;
        }

        .auth-card {
            background-color: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .auth-card h2 {
            margin-bottom: 24px;
            font-weight: 700;
        }

        .input-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            margin-bottom: 6px;
            color: var(--muted-color);
            text-transform: uppercase;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        .primary-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--text-color);
            color: var(--bg-color);
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        .primary-btn:hover {
            opacity: 0.9;
        }

        .auth-switch {
            margin-top: 16px;
            font-size: 14px;
            color: var(--muted-color);
            cursor: pointer;
            text-decoration: underline;
        }

        /* Schermata Applicazione Principale */
        .app-screen {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
        }

        .action-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 25px;
            margin-bottom: 40px;
        }

        .photo-btn {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--text-color), var(--muted-color));
            color: var(--bg-color);
            border: none;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .photo-btn:hover {
            transform: scale(1.05);
        }

        .manual-input-container {
            width: 100%;
            display: flex;
            gap: 10px;
        }

        .manual-input-container input {
            flex: 1;
            padding: 14px 18px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        .manual-input-container button {
            padding: 0 24px;
            background: var(--text-color);
            color: var(--bg-color);
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Schermata di Caricamento */
        .loading-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 0;
            text-align: center;
            width: 100%;
        }

        .pulse-ring {
            width: 90px;
            height: 90px;
            border: 3px solid var(--border-color);
            border-top: 3px solid var(--text-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 24px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 18px;
            font-weight: 600;
        }

        /* Risultati */
        .recipes-container {
            display: none;
            width: 100%;
            flex-direction: column;
            gap: 20px;
        }

        .recipes-header {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .recipe-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .recipe-title {
            font-size: 18px;
            font-weight: 700;
        }

        .recipe-info {
            display: flex;
            gap: 15px;
            font-size: 13px;
            color: var(--muted-color);
        }

        .recipe-steps {
            font-size: 14px;
            line-height: 1.5;
            opacity: 0.9;
            white-space: pre-line;
        }

        .back-to-scan {
            margin-top: 20px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 12px 24px;
            border-radius: 10px;
            cursor: pointer;
            align-self: center;
            font-weight: 600;
        }

        .back-to-scan:hover {
            border-color: var(--text-color);
        }

        #fileInput { display: none; }
    </style>
</head>
<body data-theme="dark">

    <div class="bg-diagonal-lines"></div>
    <div class="bg-glow"></div>

    <nav>
        <div class="logo">eatit.</div>
        <div class="nav-right" id="navRight" style="display: none;">
            <button class="theme-toggle" onclick="toggleTheme()">Tema</button>
            <button class="logout-btn" onclick="logout()">Esci</button>
        </div>
    </nav>

    <div class="container">
        <!-- SEZIONE LOGIN / REGISTRAZIONE -->
        <div id="authScreen" class="auth-screen">
            <div class="auth-card">
                <h2 id="authTitle">Registrati</h2>
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="authEmail" placeholder="iltuo@indirizzo.com">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="authPassword" placeholder="••••••••">
                </div>
                <button class="primary-btn" id="authSubmitBtn" onclick="handleAuth()">Crea Account</button>
                <div class="auth-switch" onclick="toggleAuthMode()" id="authSwitchText">Hai già un account? Accedi</div>
            </div>
        </div>

        <!-- SEZIONE PRINCIPALE DELL'APP -->
        <div id="appScreen" class="app-screen">
            <div class="action-section" id="actionSection">
                <input type="file" id="fileInput" accept="image/*" capture="environment" onchange="startAnalysisProcess()">
                <button class="photo-btn" onclick="document.getElementById('fileInput').click()">FOTO</button>
                
                <div class="manual-input-container">
                    <input type="text" id="manualIngredients" placeholder="Scrivi ingredienti (es. uova, zucchine, riso)...">
                    <button onclick="startAnalysisProcessManual()">Cerca</button>
                </div>
            </div>

            <!-- CARICAMENTO -->
            <div class="loading-screen" id="loadingScreen">
                <div class="pulse-ring"></div>
                <div class="loading-text" id="loadingText">L'IA sta creando le ricette per te...</div>
            </div>

            <!-- RISULTATI DINAMICI -->
            <div class="recipes-container" id="recipesContainer">
                <div class="recipes-header">Ricette Svuota-Frigo generate dall'IA:</div>
                <div id="dynamicRecipesList" style="display: flex; flex-direction: column; gap: 20px; width: 100%;"></div>
                <button class="back-to-scan" onclick="resetToScan()">Nuova Ricerca</button>
            </div>
        </div>
    </div>

    <script>
        let isLoginMode = false;

        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('authTitle').innerText = isLoginMode ? 'Accedi' : 'Registrati';
            document.getElementById('authSubmitBtn').innerText = isLoginMode ? 'Accedi' : 'Crea Account';
            document.getElementById('authSwitchText').innerText = isLoginMode ? 'Non hai un account? Registrati' : 'Hai già un account? Accedi';
        }

        function handleAuth() {
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value.trim();
            if(!email || !password) { alert('Inserisci email e password.'); return; }

            if(!isLoginMode) {
                localStorage.setItem('eatit_user', JSON.stringify({email, password}));
                alert('Account creato con successo!');
            } else {
                const saved = JSON.parse(localStorage.getItem('eatit_user'));
                if(!saved || saved.email !== email || saved.password !== password) {
                    alert('Credenziali non valide o account inesistente.');
                    return;
                }
            }
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('appScreen').style.display = 'flex';
            document.getElementById('navRight').style.display = 'flex';
        }

        function logout() {
            document.getElementById('appScreen').style.display = 'none';
            document.getElementById('navRight').style.display = 'none';
            document.getElementById('authScreen').style.display = 'flex';
            resetToScan();
        }

        function toggleTheme() {
            const body = document.body;
            body.setAttribute('data-theme', body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        }

        function startAnalysisProcess() {
            if(document.getElementById('fileInput').files[0]) {
                fetchRecipes("Foto frigo del contenuto");
            }
        }

        function startAnalysisProcessManual() {
            const text = document.getElementById('manualIngredients').value.trim();
            if(!text) { alert('Inserisci almeno un ingrediente.'); return; }
            fetchRecipes(text);
        }

        async function fetchRecipes(queryText) {
            document.getElementById('actionSection').style.display = 'none';
            document.getElementById('loadingScreen').style.display = 'flex';

            try {
                const response = await fetch('/api/get-recipes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ingredients: queryText })
                });

                const data = await response.json();
                const recipes = data.recipes || [];

                const container = document.getElementById('dynamicRecipesList');
                container.innerHTML = '';

                if (recipes.length > 0) {
                    recipes.forEach(recipe => {
                        const card = document.createElement('div');
                        card.className = 'recipe-card';
                        card.innerHTML = `
                            <div class="recipe-title">${recipe.title || 'Ricetta Svuota-Frigo'}</div>
                            <div class="recipe-info">
                                <span>⏱ ${recipe.time || '15 min'}</span>
                                <span>🔥 ${recipe.difficulty || 'Facile'}</span>
                            </div>
                            <div class="recipe-steps">${recipe.instructions || 'Nessuna istruzione disponibile.'}</div>
                        `;
                        container.appendChild(card);
                    });
                } else {
                    container.innerHTML = '<div class="recipe-card"><div class="recipe-title">Nessuna ricetta trovata</div><div class="recipe-steps">L\'intelligenza artificiale non ha restituito ricette per questi ingredienti. Riprova.</div></div>';
                }

                document.getElementById('loadingScreen').style.display = 'none';
                document.getElementById('recipesContainer').style.display = 'flex';
            } catch (err) {
                console.error("Errore fetch ricette:", err);
                document.getElementById('loadingScreen').style.display = 'none';
                alert('Errore di comunicazione con il server.');
                resetToScan();
            }
        }

        function resetToScan() {
            document.getElementById('recipesContainer').style.display = 'none';
            document.getElementById('actionSection').style.display = 'flex';
            document.getElementById('fileInput').value = '';
            document.getElementById('manualIngredients').value = '';
        }
    </script>
</body>
</html>
